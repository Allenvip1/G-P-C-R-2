// 布林带：len 日均线 ± mult 倍标准差（总体标准差），%B = (值 − 下轨) ÷ (上轨 − 下轨)

function usePrice() {                                     // 切换价格来源：ES 期货（接近 24 小时交易，跳空小）/ 标普 500 指数（只有现货时段，隔夜跳空多）

  $("ttl_p").textContent = k === "es" ? "① 标普 500 日线（E-mini 期货连续合约 ES=F，约 23 小时交易；每个季度换月时会有一次小的价差跳空）· 红涨绿跌" : "① 标普 500 指数日线（^GSPC，只有 9:30~16:00 现货时段，隔夜消息会造成跳空）· 红涨绿跌";
  legend(null);
}
function build() {
  const dates = new Set(D.price.map(r => r[0])); D.es.forEach(r => dates.add(r[0])); D.cboe.forEach(r => dates.add(r[0])); CAL = [...dates].sort();
  [cp, cs, ci].forEach(c => c.addLineSeries({ visible: false, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false }).setData(CAL.map(t => ({ time: t }))));

function ratios() {                                       // 按当前口径（成交量/持仓量）算两条比值，并算布林带
  const basis = document.querySelector('input[name="basis"]:checked').value;
  const len = Math.max(5, Math.round(+$("bbLen").value) || 20), mul = Math.max(0.5, +$("bbMul").value || 2);
  const mkSet = (cIdx, pIdx) => { const rows = D.cboe.map(r => ({ t: r[0], c: r[cIdx], p: r[pIdx], v: r[pIdx] / r[cIdx] }));
    const bb = bollinger(rows.map(x => x.v), len, mul); rows.forEach((x, i) => { x.bb = bb[i]; }); return rows; };

    st.mid.setData(on ? rows.filter(x => x.bb).map(x => ({ time: x.t, value: x.bb.mid })) : []);

  if (p) { const chg = t ? PRC.get(t) : PRC.get(p[0]), cls = chg >= 0 ? "u" : "d"; $("lg_p").innerHTML = `日期 <b>${p[0]}</b>　开 <b>${fmt(p[1])}</b> 高 <b>${fmt(p[2])}</b> 低 <b>${fmt(p[3])}</b> 收 <b class="${cls}">${fmt(p[4])}</b>　<span class="${cls}">${chg == null ? "" : (chg >= 0 ? "+" : "") + fmt(chg) }</span>`; }

    const chg = (r[4] / r[1] - 1) * 100; return head + row("开", fmt(r[1])) + row("高", fmt(r[2])) + row("低", fmt(r[3])) + row("收", `<b>${fmt(r[4])}</b>`) + row("日内涨跌", `<span class="${chg >= 0 ? "u" : "d"}">${(chg >= 0 ? "+" : "") + chg.toFixed(2)}%</span>`); }

  let h = head + row(`<b>${P.lab}</b>`, `<span class="big">${fmt(x.v, 3)}</span>`) + row("看跌", num(x.p)) + row("看涨", num(x.c));
  if (b && $("bbOn").checked) h += row("上轨", fmt(b.up, 3)) + row("中轨", fmt(b.mid, 3)) + row("下轨", fmt(b.lo, 3)) + row("%B", `<b class="${b.pb > 1 ? "u" : b.pb < 0 ? "d" : ""}">${b.pb == null ? "–" : fmt(b.pb)}</b>`);

const ENT = [{ kind: "p", chart: cp, series: candle, el: $("ch_p"), get: d => (PRICE.get(d) || [])[4] },

        if (x + w > W - 4) x = p.point.x - w - 18; e.tip.style.left = Math.max(2, x) + "px"; e.tip.style.top = Math.max(2, Math.min(H - h - 2, y)) + "px"; }

      ENT.forEach(o => { if (o === e) return; if (!t) { o.chart.clearCrosshairPosition(); return; } const v = o.get(t); if (v == null) o.chart.clearCrosshairPosition(); else o.chart.setCrosshairPosition(v, t, o.series); });
